# Copy to config.toml and set your ntfy topic.

[watch]
part = "MK1G4LL/A"                  # iPhone Duo 512GB Star White (US)
name = "iPhone Duo 512GB Star White"
carrier = "UNLOCKED/US"
zip = "10022"                       # Midtown; Apple returns the nearest stores
cities = ["New York"]               # Apple lists Manhattan stores with city "New York"
# stores = ["Fifth Avenue", "SoHo"] # optional: only watch these store names
buy_url = "https://www.apple.com/shop/buy-iphone/iphone-duo"

[check]
interval_seconds = 180              # minimum 60
jitter_seconds = 60

[ntfy]
server = "https://ntfy.sh"
# Anyone who knows the topic can read your alerts, so make it long and random.
topic = "duo-bot-change-me"
