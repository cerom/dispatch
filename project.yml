# Generate the Xcode project with:  xcodegen generate
# Change BUNDLE_ID_BASE (and set DEVELOPMENT_TEAM) before running on a device.
name: FaceKey
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID_BASE: com.example.facekey
    APP_GROUP_ID: group.$(BUNDLE_ID_BASE)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  FaceKey:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: FaceKeyKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FaceKey
        FaceKeyAppGroup: $(APP_GROUP_ID)
        NSCameraUsageDescription: FaceKey reads your facial expression to suggest matching emojis. Video never leaves your phone.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_BASE)
            CFBundleURLSchemes: [facekey]
    entitlements:
      path: App/FaceKey.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)

  FaceKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: FaceKey
        FaceKeyAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/FaceKeyKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).keyboard

  FaceKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: FaceKey

schemes:
  FaceKey:
    build:
      targets:
        FaceKey: all
    run:
      config: Debug
    test:
      targets:
        - FaceKeyTests
